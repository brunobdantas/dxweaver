name: Bootstrap DXWeaver Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  bootstrap-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and validate source snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'dxweaver-bootstrap.tgz'
          $parts = Get-ChildItem 'bootstrap/chunk*.b64' | Sort-Object Name
          if ($parts.Count -ne 5) { throw "Expected 5 bootstrap chunks, found $($parts.Count)." }
          $raw = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $bytes = [Convert]::FromBase64String($raw)
          [IO.File]::WriteAllBytes($archive, $bytes)
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $expected = '2ad0ca9cfffa8a4e698b48a8c4d68c51ec02cca4365a9fecec34af214ba10320'
          if ($actual -ne $expected) { throw "Bootstrap SHA256 mismatch. Expected $expected, got $actual." }
          Write-Host "Bootstrap archive verified: $actual"

      - name: Expand validated source snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'dxweaver-bootstrap.tgz'
          $stage = Join-Path $env:RUNNER_TEMP 'dxweaver-stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          tar -xzf $archive -C $stage
          $source = Join-Path $stage 'dxweaver'
          if (-not (Test-Path (Join-Path $source 'pyproject.toml'))) { throw 'Snapshot missing pyproject.toml.' }
          Copy-Item -Path (Join-Path $source '*') -Destination . -Recurse -Force
          Copy-Item -Path (Join-Path $source '.gitignore') -Destination '.gitignore' -Force
          Copy-Item -Path (Join-Path $source '.github') -Destination '.' -Recurse -Force
          Remove-Item -Recurse -Force bootstrap
          Remove-Item -Force '.github/workflows/bootstrap-source.yml'

      - name: Commit canonical v0.3.0 tree
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: bootstrap DXWeaver v0.3.0 operator console and Windows CI'
          git push origin HEAD:main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Test and build Windows installer
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Upload first standalone installer
        uses: actions/upload-artifact@v4
        with:
          name: DXWeaver-0.3.0-Windows-bootstrap
          path: |
            installer-output/DXWeaver-0.3.0-Setup.exe
            installer-output/SHA256.txt
          if-no-files-found: error
          retention-days: 30
