name: Bootstrap DXWeaver Source

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/source.tgz.b64'
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  bootstrap-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand validated source snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'dxweaver-bootstrap.tgz'
          $raw = Get-Content 'bootstrap/source.tgz.b64' -Raw
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($raw.Trim()))
          tar -xzf $archive -C $env:RUNNER_TEMP
          Copy-Item -Path (Join-Path $env:RUNNER_TEMP 'dxweaver\*') -Destination . -Recurse -Force
          Remove-Item -Recurse -Force bootstrap
          Remove-Item -Force '.github/workflows/bootstrap-source.yml'

      - name: Commit canonical v0.3.0 tree
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: bootstrap DXWeaver v0.3.0 operator console and Windows CI'
          git push origin HEAD:main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Test and build Windows installer
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Upload first standalone installer
        uses: actions/upload-artifact@v4
        with:
          name: DXWeaver-0.3.0-Windows-bootstrap
          path: |
            installer-output/DXWeaver-0.3.0-Setup.exe
            installer-output/SHA256.txt
          if-no-files-found: error
          retention-days: 30
