name: Windows Installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish/update the v0.3.2 GitHub Release"
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dxweaver-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Test and build standalone installer
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DXWeaver-0.3.2-Windows
          path: |
            installer-output/DXWeaver-0.3.2-Setup.exe
            installer-output/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.2
          target_commitish: ${{ github.sha }}
          name: DXWeaver v0.3.2
          body: |
            DXWeaver v0.3.2 Windows standalone installer.

            Fixes startup regression in v0.3.1 caused by a missing Engine.attach_fanout method.
            Keeps the single-listener UDP topology:
            MSHV -> DXWeaver :2237 -> GridTracker :2238 -> DXWeaver relay :2239 -> WRL :2240.
            Adds a regression test for fanout attachment/telemetry.
          files: |
            installer-output/DXWeaver-0.3.2-Setup.exe
            installer-output/SHA256.txt
          fail_on_unmatched_files: true
          overwrite_files: true
