name: Windows Installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish/update the v0.4.0 GitHub Release"
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dxweaver-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Test and build standalone installer
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DXWeaver-0.4.0-Windows
          path: |
            installer-output/DXWeaver-0.4.0-Setup.exe
            installer-output/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.0
          target_commitish: ${{ github.sha }}
          name: DXWeaver v0.4.0
          body: |
            DXWeaver v0.4.0 — native MSHV control architecture.

            The live FT8 QSO state machine is no longer reimplemented in Python.
            - ANSWER is delegated to MSHV Multi Answering Auto Seq Protocol Standard.
            - HUNT uses DXWeaver scoring only to select the initial CQ; MSHV owns the exchange after selection.
            - BOTH combines native Multi Answer with scored hunt selection.
            - ARM has requested vs confirmed states; automatic hunt selection is blocked until the custom MSHV acknowledges AUTO + AutoSeq.
            - GridTracker/WRL topology remains single-listener: MSHV -> DXWeaver :2237 -> GridTracker :2238 -> DXWeaver relay :2239 -> WRL :2240.

            The companion GPL MSHV-DXWeaver build is produced by the separate native-MSHV workflow from the pinned official MSHV source.
          files: |
            installer-output/DXWeaver-0.4.0-Setup.exe
            installer-output/SHA256.txt
          fail_on_unmatched_files: true
          overwrite_files: true
