name: Windows Installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish/update the v0.3.4 GitHub Release"
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dxweaver-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Test and build standalone installer
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DXWeaver-0.3.4-Windows
          path: |
            installer-output/DXWeaver-0.3.4-Setup.exe
            installer-output/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.4
          target_commitish: ${{ github.sha }}
          name: DXWeaver v0.3.4
          body: |
            DXWeaver v0.3.4 Windows standalone installer.

            On-air QSO state-machine hardening:
            - direct callers outrank hunt CQs in BOTH/ANSWER;
            - a direct caller may preempt an unanswered hunt attempt;
            - once the hunted station replies, the QSO is LOCKED and cannot be stolen mid exchange;
            - HUNT / ANSWER / BOTH are enforced by the decision engine;
            - unanswered hunts use a shorter timeout;
            - explicit calls to our callsign are accepted outside the old post-CQ window by default;
            - strict CI now aborts before packaging/release on any pytest, PyInstaller, self-test, or Inno Setup failure.

            Single-listener UDP topology remains:
            MSHV -> DXWeaver :2237 -> GridTracker :2238 -> DXWeaver relay :2239 -> WRL :2240.
          files: |
            installer-output/DXWeaver-0.3.4-Setup.exe
            installer-output/SHA256.txt
          fail_on_unmatched_files: true
          overwrite_files: true
