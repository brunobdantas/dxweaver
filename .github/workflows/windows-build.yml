name: DXWeaver Native Windows

on:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "src/native/**"
      - "tests/native/**"
      - "mshv/apply_dxweaver_v052_patch.py"
      - "scripts/build_windows.ps1"
      - "installer/DXWeaver-0.5.2.iss"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish/update v0.5.2 GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: dxweaver-native-052-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 55

    steps:
      - name: Checkout DXWeaver
        uses: actions/checkout@v7

      - name: Set up Python for fail-closed source patching
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Qt 5.15.2 and MinGW 8.1
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"
          host: "windows"
          target: "desktop"
          arch: "win64_mingw81"
          tools: "tools_mingw,qt.tools.win64_mingw810"
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }

      - name: Verify toolchain
        shell: pwsh
        run: |
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw "CMake unavailable" }
          (Get-Command qmake.exe -ErrorAction Stop).Source
          (Get-Command mingw32-make.exe -ErrorAction Stop).Source
          (Get-Command g++.exe -ErrorAction Stop).Source
          (Get-Command windeployqt.exe -ErrorAction Stop).Source

      - name: Native Release build, exhaustive QA and installer
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Upload official Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DXWeaver-0.5.2-Windows
          path: |
            installer-output/DXWeaver-0.5.2-Setup.exe
            installer-output/DXWeaver-0.5.2-SHA256.txt
            installer-output/DXWeaver-0.5.2-Source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish v0.5.2 Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.2
          target_commitish: ${{ github.sha }}
          name: DXWeaver v0.5.2 Native
          body: |
            DXWeaver v0.5.2 — native HUNT activation corrective release.

            Functional correction:
            - HUNT no longer routes a ranked CQ station into passive SetTextForAutoSeq;
            - ranked CQ targets use MSHV's native decode-selection path (DecListTextAll), equivalent to selecting/double-clicking the station in the decode list;
            - ANSWER/direct callers remain on the native AutoSeq reaction path;
            - HUNT and ANSWER action types are distinct and covered by CTest;
            - CI fails closed unless both native routes are present in the patched MSHV source.

            Existing v0.5.1 cockpit/layout corrections remain intact:
            - DXWeaver panel and Candidates Matrix are owned by MSHV's master QVBoxLayout;
            - application-wide dark design system;
            - packaged GUI smoke test;
            - GPL corresponding source bundle.

            The radio/DSP foundation is a GPL-3.0 derivative of official MSHV source at the pinned commit recorded in the source bundle.
          files: |
            installer-output/DXWeaver-0.5.2-Setup.exe
            installer-output/DXWeaver-0.5.2-SHA256.txt
            installer-output/DXWeaver-0.5.2-Source.zip
          fail_on_unmatched_files: true
          overwrite_files: true
