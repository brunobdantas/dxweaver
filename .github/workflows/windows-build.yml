name: DXWeaver Native Windows

on:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "src/native/**"
      - "tests/native/**"
      - "mshv/apply_dxweaver_v053_patch.py"
      - "scripts/build_windows.ps1"
      - "installer/DXWeaver-0.5.3.iss"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish/update v0.5.3 GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: dxweaver-native-053-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 55

    steps:
      - name: Checkout DXWeaver
        uses: actions/checkout@v7

      - name: Set up Python for fail-closed source patching
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Qt 5.15.2 and MinGW 8.1
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"
          host: "windows"
          target: "desktop"
          arch: "win64_mingw81"
          tools: "tools_mingw,qt.tools.win64_mingw810"
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }

      - name: Verify toolchain
        shell: pwsh
        run: |
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw "CMake unavailable" }
          (Get-Command qmake.exe -ErrorAction Stop).Source
          (Get-Command mingw32-make.exe -ErrorAction Stop).Source
          (Get-Command g++.exe -ErrorAction Stop).Source
          (Get-Command windeployqt.exe -ErrorAction Stop).Source

      - name: Native Release build, exhaustive QA and installer
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Upload official Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DXWeaver-0.5.3-Windows
          path: |
            installer-output/DXWeaver-0.5.3-Setup.exe
            installer-output/DXWeaver-0.5.3-SHA256.txt
            installer-output/DXWeaver-0.5.3-Source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish v0.5.3 Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.3
          target_commitish: ${{ github.sha }}
          name: DXWeaver v0.5.3 Native
          body: |
            DXWeaver v0.5.3 — HUNT liveness and stale-target safety release.

            Safety/behavior corrections:
            - unanswered HUNT targets can no longer remain active indefinitely;
            - a HUNT watchdog stops a target after 30 s of disappearance/no response, with a 45 s absolute ceiling;
            - an engaged QSO (report/R-report/RR73/73) is exempt from the HUNT watchdog and remains locked;
            - timeout performs HALT TX, applies cooldown and may select a fresh runner-up;
            - HUNT selection is restricted to stations actually heard calling CQ recently;
            - directed callers are no longer eligible to leak into the HUNT candidate pool;
            - fresh-CQ and watchdog behavior are covered by CTest and fail-closed integration gates.

            Existing native behavior remains:
            - HUNT uses the native decode-selection/double-click path;
            - ANSWER uses native AutoSeq reaction;
            - in-process automation, Candidates Matrix and dark cockpit;
            - GPL corresponding source bundle.

            The radio/DSP foundation is a GPL-3.0 derivative of official MSHV source at the pinned commit recorded in the source bundle.
          files: |
            installer-output/DXWeaver-0.5.3-Setup.exe
            installer-output/DXWeaver-0.5.3-SHA256.txt
            installer-output/DXWeaver-0.5.3-Source.zip
          fail_on_unmatched_files: true
          overwrite_files: true
