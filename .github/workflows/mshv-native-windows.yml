name: MSHV-DXWeaver Native Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mshv/**"
      - "installer/MSHV-DXWeaver.iss"
      - ".github/workflows/mshv-native-windows.yml"

permissions:
  contents: read

concurrency:
  group: mshv-dxweaver-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-mshv:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout DXWeaver
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Clone pinned official MSHV
        shell: pwsh
        run: |
          git clone https://github.com/LZ2HV/MSHV.git mshv-upstream
          if ($LASTEXITCODE -ne 0) { throw "MSHV clone failed" }
          git -C mshv-upstream checkout 8f93eb3e25056f0cb18699ef6c3bef3998c52cdf
          if ($LASTEXITCODE -ne 0) { throw "MSHV pinned checkout failed" }
          $sha = (git -C mshv-upstream rev-parse HEAD).Trim()
          if ($sha -ne "8f93eb3e25056f0cb18699ef6c3bef3998c52cdf") { throw "unexpected MSHV commit $sha" }

      - name: Validate and apply DXWeaver native patches
        shell: pwsh
        run: |
          python -m py_compile mshv/apply_dxweaver_patch.py mshv/apply_dxweaver_runtime_fix.py
          if ($LASTEXITCODE -ne 0) { throw "MSHV patcher syntax validation failed" }
          python mshv/apply_dxweaver_patch.py mshv-upstream
          if ($LASTEXITCODE -ne 0) { throw "DXWeaver base MSHV patch failed" }
          python mshv/apply_dxweaver_runtime_fix.py mshv-upstream
          if ($LASTEXITCODE -ne 0) { throw "DXWeaver MSHV runtime hardening failed" }
          git -C mshv-upstream diff --check
          if ($LASTEXITCODE -ne 0) { throw "patched MSHV diff check failed" }
          git -C mshv-upstream diff --stat

      - name: Install Qt 5.15.2 MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"
          host: "windows"
          target: "desktop"
          arch: "win64_mingw81"
          tools: "tools_mingw,qt.tools.win64_mingw810"
          cache: true

      - name: Resolve MinGW tools
        id: mingw
        shell: pwsh
        run: |
          $qmake = (Get-Command qmake.exe -ErrorAction Stop).Source
          $make = (Get-Command mingw32-make.exe -ErrorAction Stop).Source
          "qmake=$qmake" >> $env:GITHUB_OUTPUT
          "make=$make" >> $env:GITHUB_OUTPUT

      - name: Build MSHV-DXWeaver x64
        shell: pwsh
        working-directory: mshv-upstream
        run: |
          & "${{ steps.mingw.outputs.qmake }}" MSHV_WIN64.pro "CONFIG+=release"
          if ($LASTEXITCODE -ne 0) { throw "qmake failed with $LASTEXITCODE" }
          & "${{ steps.mingw.outputs.make }}" -j2
          if ($LASTEXITCODE -ne 0) { throw "MinGW build failed with $LASTEXITCODE" }
          if (-not (Test-Path "bin/MSHV-DXWeaver.exe")) { throw "MSHV-DXWeaver.exe was not produced" }

      - name: Stage application and runtime
        shell: pwsh
        run: |
          $pkg = Join-Path $PWD "mshv-package"
          if (Test-Path $pkg) { Remove-Item -Recurse -Force $pkg }
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item "mshv-upstream/bin/*" $pkg -Recurse -Force
          Remove-Item -Recurse -Force "$pkg/log","$pkg/AllTxtMonthly" -ErrorAction SilentlyContinue
          Get-ChildItem $pkg -Recurse -File -Include *.ttf,*.otf,*.woff,*.woff2 -ErrorAction SilentlyContinue | Remove-Item -Force

          $qtBin = Join-Path $env:QT_ROOT_DIR "bin"
          $qtPlugins = $env:QT_PLUGIN_PATH
          $mingwBin = Split-Path -Parent "${{ steps.mingw.outputs.make }}"
          foreach ($dll in @("Qt5Core.dll","Qt5Gui.dll","Qt5Network.dll","Qt5WebSockets.dll","Qt5Widgets.dll")) {
            $src = Join-Path $qtBin $dll
            if (-not (Test-Path $src)) { throw "required Qt runtime missing: $src" }
            Copy-Item $src $pkg -Force
          }
          foreach ($dll in @("libEGL.dll","libGLESv2.dll","d3dcompiler_47.dll","opengl32sw.dll","Qt5Svg.dll")) {
            $src = Join-Path $qtBin $dll
            if (Test-Path $src) { Copy-Item $src $pkg -Force }
          }
          New-Item -ItemType Directory -Force "$pkg/platforms" | Out-Null
          $qwindows = Join-Path $qtPlugins "platforms/qwindows.dll"
          if (-not (Test-Path $qwindows)) { throw "qwindows.dll missing" }
          Copy-Item $qwindows "$pkg/platforms/qwindows.dll" -Force
          foreach ($pluginDir in @("styles","imageformats")) {
            $srcDir = Join-Path $qtPlugins $pluginDir
            if (Test-Path $srcDir) { Copy-Item $srcDir "$pkg/$pluginDir" -Recurse -Force }
          }
          foreach ($dll in @("libgcc_s_seh-1.dll","libstdc++-6.dll","libwinpthread-1.dll")) {
            $src = Join-Path $mingwBin $dll
            if (-not (Test-Path $src)) { throw "required MinGW runtime missing: $src" }
            Copy-Item $src $pkg -Force
          }
          if (-not (Test-Path "$pkg/MSHV-DXWeaver.exe")) { throw "staged executable missing" }

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $pkg = Join-Path $PWD "mshv-package"
          $p = Start-Process -FilePath "$pkg/MSHV-DXWeaver.exe" -WorkingDirectory $pkg -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) {
            if ($p.ExitCode -ne 0) { throw "packaged executable exited with code $($p.ExitCode)" }
          } else {
            Stop-Process -Id $p.Id -Force
          }

      - name: Add GPL notices and corresponding source
        shell: pwsh
        run: |
          Copy-Item "mshv-upstream/COPYING.txt" "mshv-package/COPYING-MSHV-GPL3.txt" -Force
          Copy-Item "mshv/apply_dxweaver_patch.py" "mshv-package/DXWeaver-MSHV-Patch-Source.py" -Force
          Copy-Item "mshv/apply_dxweaver_runtime_fix.py" "mshv-package/DXWeaver-MSHV-Runtime-Fix-Source.py" -Force
          cmd /c "git -C mshv-upstream diff --binary > mshv-package\DXWeaver-MSHV-0.4.1.patch"
          if ($LASTEXITCODE -ne 0) { throw "failed to export MSHV patch" }
          @"
          MSHV-DXWeaver 0.4.1
          Official MSHV upstream: https://github.com/LZ2HV/MSHV
          Upstream commit: 8f93eb3e25056f0cb18699ef6c3bef3998c52cdf
          DXWeaver repository: https://github.com/brunobdantas/dxweaver
          MSHV derivative license: GPL-3.0
          "@ | Set-Content "mshv-package/UPSTREAM-DXWEAVER.txt" -Encoding UTF8

          git -C mshv-upstream -c user.name="DXWeaver CI" -c user.email="ci@dxweaver.invalid" add -u
          git -C mshv-upstream -c user.name="DXWeaver CI" -c user.email="ci@dxweaver.invalid" commit -m "DXWeaver 0.4.1 native profile transition fix"
          if ($LASTEXITCODE -ne 0) { throw "failed to commit patched source" }
          git -C mshv-upstream archive --format=zip --output="$PWD/MSHV-DXWeaver-0.4.1-Source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw "source archive failed" }

      - name: Create portable Windows archive
        shell: pwsh
        run: |
          tar.exe -a -c -f "MSHV-DXWeaver-0.4.1-Windows.zip" -C "mshv-package" .
          if ($LASTEXITCODE -ne 0) { throw "portable ZIP creation failed" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }

      - name: Build installer and hashes
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            foreach ($p in @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe","C:\Program Files\Inno Setup 6\ISCC.exe")) {
              if (Test-Path $p) { $iscc = $p; break }
            }
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          New-Item -ItemType Directory -Force "installer-output-mshv" | Out-Null
          & $iscc "installer/MSHV-DXWeaver.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }
          $setup = "installer-output-mshv/MSHV-DXWeaver-0.4.1-Setup.exe"
          if (-not (Test-Path $setup)) { throw "installer missing" }
          $files = @("MSHV-DXWeaver-0.4.1-Windows.zip","MSHV-DXWeaver-0.4.1-Source.zip",$setup)
          $lines = foreach ($file in $files) {
            $h = Get-FileHash $file -Algorithm SHA256
            "$($h.Hash)  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content "MSHV-DXWeaver-0.4.1-SHA256.txt" -Encoding ascii

      - name: Upload native MSHV installable package
        uses: actions/upload-artifact@v4
        with:
          name: MSHV-DXWeaver-0.4.1-Windows-Installable
          path: |
            installer-output-mshv/MSHV-DXWeaver-0.4.1-Setup.exe
            MSHV-DXWeaver-0.4.1-Windows.zip
            MSHV-DXWeaver-0.4.1-Source.zip
            MSHV-DXWeaver-0.4.1-SHA256.txt
          if-no-files-found: error
          retention-days: 30
